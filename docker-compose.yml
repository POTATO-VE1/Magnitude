services:
  vectordb:
    build: .
    container_name: magnitude-vectordb
    ports:
      - "8080:8080"                  # REST API
      - "9090:9090"                  # gRPC
      - "127.0.0.1:2112:2112"       # Prometheus metrics (localhost only)
    volumes:
      - vectordb-data:/app/data
      - ./certs:/app/certs:ro
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"
        reservations:
          memory: 1G
    environment:
      - GOGC=100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vectordb-data:
    driver: local
