[package]
name = "magnitude"
version = "0.1.0"
edition = "2021"
description = "Rust client for the Magnitude vector database"
license = "MIT"
repository = "https://github.com/POTATO-VE1/Magnitude"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
