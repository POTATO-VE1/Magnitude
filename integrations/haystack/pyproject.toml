[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haystack-magnitude"
version = "0.1.0"
description = "Haystack document store integration for Magnitude"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "haystack-ai>=2.0.0",
    "magnitude-client>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["haystack_magnitude"]
